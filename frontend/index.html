<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FAF7F2" />
    
    <!-- Primary Metadata -->
    <title>Dropify — Free & Ad-Free Music Player for Android and Windows PC</title>
    <meta name="title" content="Dropify — Free & Ad-Free Music Player for Android and Windows PC" />
    <meta name="description" content="Discover a better way to listen. Dropify is a crafted, 100% ad-free music player for Android and Windows PC with a 2D tactile design, rotating vinyl turntable, synchronized lyrics, and 10-band equalizer." />
    <link rel="canonical" href="https://dropify.vercel.app" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://dropify.vercel.app" />
    <meta property="og:title" content="Dropify — Free & Ad-Free Music Player for Android and Windows PC" />
    <meta property="og:description" content="Your music. Your rules. 100% free, 100% ad-free music experience with real-time synced lyrics, vinyl turntable, and 10-band equalizer." />
    <meta property="og:image" content="https://dropify.vercel.app/assets/screenshot_turntable.jpg" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://dropify.vercel.app" />
    <meta name="twitter:title" content="Dropify — Free & Ad-Free Music Player for Android and Windows PC" />
    <meta name="twitter:description" content="Your music. Your rules. 100% free, 100% ad-free music experience with real-time synced lyrics, vinyl turntable, and 10-band equalizer." />
    <meta name="twitter:image" content="https://dropify.vercel.app/assets/screenshot_turntable.jpg" />

    <!-- Mobile App Capabilities -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Dropify" />
    <meta name="mobile-web-app-capable" content="yes" />
    
    <!-- Icons & Manifest -->
    <link rel="icon" type="image/png" href="/assets/dropify_logo.png" />
    <link rel="apple-touch-icon" href="/assets/dropify_logo.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Google Fonts Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator && (window.location.protocol === 'https:' || window.location.hostname === 'localhost')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(err => {
            console.warn('SW registration notice:', err);
          });
        });
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
